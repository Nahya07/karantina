const DEFAULT_KEY='sb_publishable_GqlRl1EZRx2rb3wppTD7dQ_LNR4sM4Y';
const _c={};const getClient=(u,k)=>{try{if(!u||!k)return null;return _c[u+k]||(_c[u+k]=window.supabase.createClient(u,k))}catch(e){return null}};
const dbSantri=s=>({id:s.id,nis:s.nis,name:s.name,group_name:s.group,musyrif_id:s.musyrifId||null,total_hafalan_juz:s.totalHafalanJuz,hafalan_hilang_juz:s.hafalanHilangJuz,target_pemulihan_hal:s.targetPemulihanHal,target_kurang_lancar:s.targetKurangLancar,target_mutqin:s.targetMutqin,start_date:s.startDate,status:s.status,recovered_pages:s.recoveredPages,status_mutqin:s.statusMutqin});
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
const pageCount=(s)=>{const m=String(s||'').match(/(\d+)\s*[-–]\s*(\d+)/);return m?Math.abs(+m[2]-+m[1])+1:(/\d/.test(String(s))?1:0)};
const statusCls=s=>s==='Berhasil'?'bg-emerald-100 text-emerald-800':s==='Belum Lulus'?'bg-rose-100 text-rose-800':'bg-amber-100 text-amber-800';
const TAB_LABELS={dashboard:'Dashboard Utama',santri:'Data Santri',musyrif:'Data Musyrif',pemetaan:'Pemetaan Hafalan',setoran:'Setoran Harian',kontrol12:'Monitoring 12 Pekan',bulanan:'Evaluasi Bulanan',evaluasiAkhir:'Evaluasi Akhir 90 Hari',laporan:'Laporan & Cetak PDF',settings:'Pengaturan & Supabase'};

const INITIAL_MUSYRIF = [

    targetKurangLancar: '1 Juz (Juz 1)',

const INITIAL_SETORAN = [

    id: 'set-1',
    date: '2026-03-02',

    santriName: 'Muhammad Farhan',
    category: 'Pemulihan Hafalan Hilang',
    juz: 2,

    errors: 'Macet di ayat 177 (hukum mad)',

function App() {
  // Auth state
  const [isAuthenticated, setIsAuthenticated] = useState(DEMO);
  const [userRole, setUserRole] = useState(()=>localStorage.getItem('nahya_role')||'Koordinator Nahya'); // Koordinator / Musyrif / Admin

  // Main navigation tab
  const [demo, setDemo] = useState(DEMO);
  const [authError, setAuthError] = useState('');
  const [authLoading, setAuthLoading] = useState(false);
  const [activeTab, setActiveTab] = useState('dashboard');

  // Supabase Configuration State
  const [supabaseUrl, setSupabaseUrl] = useState(()=>DEFAULT_URL||localStorage.getItem('nahya_sb_url')||'');
  const [supabaseAnonKey, setSupabaseAnonKey] = useState(()=>localStorage.getItem('nahya_sb_key')||DEFAULT_KEY);
  const [supabaseStatus, setSupabaseStatus] = useState('Mode Lokal (data tersimpan di browser)');

  // Main Data States
  const [santriList, setSantriList] = useState(()=>DEMO?load('nahya_santri',INITIAL_SANTRI):[]);
  const [musyrifList, setMusyrifList] = useState(()=>DEMO?load('nahya_musyrif',INITIAL_MUSYRIF):[]);
  const [setoranList, setSetoranList] = useState(()=>DEMO?load('nahya_setoran',INITIAL_SETORAN):[]);

  // Selected Filter / Detailed States
  const [selectedSantriId, setSelectedSantriId] = useState('s1');
  const [selectedPekan, setSelectedPekan] = useState(1);
  const [selectedBulan, setSelectedBulan] = useState(1);
  const [searchQuery, setSearchQuery] = useState('');

  // Modals
  const [showSantriModal, setShowSantriModal] = useState(false);
  const [showSetoranModal, setShowSetoranModal] = useState(false);
  const [showMusyrifModal, setShowMusyrifModal] = useState(false);
  const [showForgotModal, setShowForgotModal] = useState(false);
  const [editingSantri, setEditingSantri] = useState(null);

  useEffect(()=>{if(!demo)return;localStorage.setItem('nahya_santri',JSON.stringify(santriList));localStorage.setItem('nahya_musyrif',JSON.stringify(musyrifList));localStorage.setItem('nahya_setoran',JSON.stringify(setoranList));},[santriList,musyrifList,setoranList,demo]);
  useEffect(()=>{setSupabaseStatus(demo?'Mode Demo Lokal':isAuthenticated?'Terhubung ke Supabase':'Belum login')},[demo,isAuthenticated]);
  useEffect(()=>{localStorage.setItem('nahya_auth',isAuthenticated?'1':'0');localStorage.setItem('nahya_role',userRole);},[isAuthenticated,userRole]);

  // Calculated Stats
  const totalSantri = santriList.length;
  const totalMusyrif = musyrifList.length;
  const santriAktif = santriList.filter(s => s.status === 'Aktif').length;
  const targetCompleted = santriList.filter(s => s.recoveredPages >= s.targetPemulihanHal).length;
  const totalPagesRecovered = santriList.reduce((acc, curr) => acc + (curr.recoveredPages || 0), 0);
  const santriPenguatan = santriList.filter(s => s.statusMutqin === 'Perlu Penguatan').length;
  const santriMutqin = santriList.filter(s => s.statusMutqin === 'Mutqin Standard').length;
  const santriKhusus = santriList.filter(s => s.statusMutqin === 'Pendampingan Khusus').length;

  const sb = getClient(supabaseUrl.trim(), supabaseAnonKey.trim());
  const loadAll = async (c) => {
    const [m, s, r] = await Promise.all([
      c.from('musyrif').select('*').order('created_at'),
      c.from('santri').select('*').order('created_at'),
      c.from('setoran_harian').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }),
    ]);
    const err = m.error || s.error || r.error;
    if (err) { alert('Gagal memuat data: ' + err.message); return; }
    const ml = m.data.map(x => ({ id: x.id, name: x.name, email: x.email, phone: x.phone || '', assignedCount: 0 }));
    const mn = id => ml.find(x => x.id === id)?.name || '-';
    const sl = s.data.map(x => ({ id: x.id, nis: x.nis, name: x.name, group: x.group_name, musyrifId: x.musyrif_id, musyrifName: mn(x.musyrif_id), totalHafalanJuz: x.total_hafalan_juz, hafalanHilangJuz: x.hafalan_hilang_juz, targetPemulihanHal: x.target_pemulihan_hal, targetKurangLancar: x.target_kurang_lancar || '', targetMutqin: x.target_mutqin || '', startDate: x.start_date, status: x.status, recoveredPages: x.recovered_pages, statusMutqin: x.status_mutqin }));
    const nm = id => sl.find(x => x.id === id)?.name || 'Santri';
    const rl = r.data.map(x => ({ id: x.id, date: x.date, santriId: x.santri_id, santriName: nm(x.santri_id), category: x.category, juz: x.juz, surah: x.surah, pages: x.pages, status: x.status, errors: x.errors || '', repeatPart: x.repeat_part || '', musyrifName: mn(x.musyrif_id), confirmed: x.confirmed }));
    setMusyrifList(ml); setSantriList(sl); setSetoranList(rl);
    setSelectedSantriId(id => sl.find(x => x.id === id) ? id : (sl[0]?.id || ''));
  };
  const sync = async (fn) => {
    if (demo || !sb) return;
    const { error } = await fn(sb);
    if (error) { alert('Gagal sinkron ke Supabase: ' + error.message); loadAll(sb); }
  };
  const afterLogin = async (user, c) => {
    const { data: p, error } = await c.from('profiles').select('name,role').eq('id', user.id).maybeSingle();
    if (error || !p) {
      await c.auth.signOut();
      setAuthError(error ? error.message : 'Akun ini belum terdaftar sebagai staf (tabel profiles). Jalankan perintah INSERT profil di SQL Editor Supabase.');
      return;
    }
    setAuthError(''); setUserRole(p.name || p.role);
    await loadAll(c); setIsAuthenticated(true);
  };
  const handleLogin = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const url = String(f.get('url') || supabaseUrl || '').trim().replace(/\/$/, '');
    const c = getClient(url, supabaseAnonKey.trim());
    if (!c) { setAuthError('Project URL tidak valid (contoh: https://xxxx.supabase.co).'); return; }
    setAuthLoading(true); setAuthError('');
    localStorage.setItem('nahya_sb_url', url); setSupabaseUrl(url);
    const { data, error } = await c.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
    if (error) setAuthError(error.message); else await afterLogin(data.user, c);
    setAuthLoading(false);
  };
  const changePw = async () => {
    if (demo || !sb) return alert('Ganti sandi hanya untuk akun Supabase.');
    const pw = prompt('Sandi baru (minimal 6 karakter):');
    if (!pw) return;
    const { error } = await sb.auth.updateUser({ password: pw });
    alert(error ? error.message : 'Sandi berhasil diganti.');
  };
  const logout = async () => {
    if (demo) { localStorage.removeItem('nahya_demo'); setDemo(false); }
    else if (sb) await sb.auth.signOut();
    setSantriList([]); setMusyrifList([]); setSetoranList([]); setIsAuthenticated(false);
  };
  useEffect(() => { if (!demo && sb) sb.auth.getSession().then(({ data }) => { if (data.session) afterLogin(data.session.user, sb); }); }, []);

  // Handler for adding/updating Santri
  const handleSaveSantri = (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const newSantri = {
      id: editingSantri ? editingSantri.id : crypto.randomUUID(),
      nis: formData.get('nis'),
      name: formData.get('name'),
      group: formData.get('group'),
      musyrifId: formData.get('musyrifId'),
      musyrifName: musyrifList.find(m => m.id === formData.get('musyrifId'))?.name || '-',
      totalHafalanJuz: Number(formData.get('totalHafalanJuz')),
      hafalanHilangJuz: Number(formData.get('hafalanHilangJuz')),
      targetPemulihanHal: Number(formData.get('hafalanHilangJuz')) * 20, // 1 Juz = 20 hal
      targetKurangLancar: formData.get('targetKurangLancar'),
      targetMutqin: formData.get('targetMutqin'),
      startDate: formData.get('startDate'),
      status: editingSantri?.status || 'Aktif',
      recoveredPages: Math.min(editingSantri?.recoveredPages || 0, Number(formData.get('hafalanHilangJuz')) * 20),
      statusMutqin: editingSantri?.statusMutqin || 'Perlu Penguatan',
    };

    if (editingSantri) {
      setSantriList(santriList.map(s => s.id === editingSantri.id ? newSantri : s));
    } else {
      setSantriList([...santriList, newSantri]);
    }
    sync(c => c.from('santri').upsert(dbSantri(newSantri)));
    setShowSantriModal(false);
    setEditingSantri(null);
  };

  // Handler for adding Setoran
  const handleSaveSetoran = (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const selectedSantriObj = santriList.find(s => s.id === formData.get('santriId'));
    if (!selectedSantriObj) { alert('Pilih santri dulu (tambah santri bila belum ada).'); return; }
    const newEntry = {
      id: crypto.randomUUID(),
      date: formData.get('date'),
      santriId: formData.get('santriId'),
      santriName: selectedSantriObj?.name || 'Santri',
      category: formData.get('category'),
      juz: Number(formData.get('juz')),
      surah: formData.get('surah'),
      pages: formData.get('pages'),
      status: formData.get('status'),
      errors: formData.get('errors'),
      repeatPart: formData.get('repeatPart'),
      musyrifName: selectedSantriObj?.musyrifName || '-',
      confirmed: true,
    };

    setSetoranList([newEntry, ...setoranList]);
    sync(c => c.from('setoran_harian').insert({ id: newEntry.id, santri_id: newEntry.santriId, date: newEntry.date, category: newEntry.category, juz: newEntry.juz, surah: newEntry.surah, pages: newEntry.pages, status: newEntry.status, errors: newEntry.errors, repeat_part: newEntry.repeatPart, musyrif_id: selectedSantriObj.musyrifId || null, confirmed: true }));

    // Update pages if recovery category & successful
    if (formData.get('category') === 'Pemulihan Hafalan Hilang' && formData.get('status') === 'Berhasil') {
      setSantriList(santriList.map(s => {
        if (s.id === formData.get('santriId')) {
          return { ...s, recoveredPages: Math.min(s.targetPemulihanHal, s.recoveredPages + (pageCount(formData.get('pages')) || 2)) };
        }
        return s;
      }));
    }

    if (formData.get('category') === 'Pemulihan Hafalan Hilang' && formData.get('status') === 'Berhasil') {
      const np = Math.min(selectedSantriObj.targetPemulihanHal, selectedSantriObj.recoveredPages + (pageCount(formData.get('pages')) || 2));
      sync(c => c.from('santri').update({ recovered_pages: np }).eq('id', selectedSantriObj.id));
    }
    setShowSetoranModal(false);
  };

  const pekanOf=(d,t0,len)=>Math.floor((new Date(d)-t0)/len);
  // Selected Santri Object for Detail Views
  const currentSantri = useMemo(() => {
    return santriList.find(s => s.id === selectedSantriId) || santriList[0] || EMPTY_SANTRI;
  }, [santriList, selectedSantriId]);
  const perPekan = Math.ceil((currentSantri.targetPemulihanHal || 0) / 12);
  const t0 = new Date(currentSantri.startDate).getTime();
  const hilangOK = r => r.santriId === currentSantri.id && r.category === 'Pemulihan Hafalan Hilang' && r.status === 'Berhasil';
  const weekData = useMemo(() => {
    const rows = setoranList.filter(r => r.santriId === currentSantri.id && pekanOf(r.date, t0, 604800000) === selectedPekan - 1);
    const days = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'].map((d, i) => {
      const dr = rows.filter(r => new Date(r.date).getUTCDay() === i + 1);
      const by = c => dr.find(r => r.category === c);
      return { day: d, hil: by('Pemulihan Hafalan Hilang'), kl: by('Murajaah Kurang Lancar'), mq: by('Murajaah Mutqin'), notes: dr.map(r => r.errors).filter(Boolean).join('; '), paraf: dr.length > 0 && dr.every(r => r.confirmed) };
    });
    return { days, done: rows.filter(hilangOK).reduce((a, r) => a + pageCount(r.pages), 0) };
  }, [setoranList, currentSantri, selectedPekan]);
  const monthDone = useMemo(() => setoranList.filter(r => hilangOK(r) && pekanOf(r.date, t0, 2419200000) === selectedBulan - 1).reduce((a, r) => a + pageCount(r.pages), 0), [setoranList, currentSantri, selectedBulan]);
  const weeklyChart = useMemo(() => {
    const total = santriList.reduce((a, s) => a + (s.targetPemulihanHal || 0), 0);
    const start = santriList.length ? Math.min(...santriList.map(s => new Date(s.startDate).getTime())) : Date.now();
    let cum = 0;
    return Array.from({ length: 12 }, (_, i) => {
      const rows = setoranList.filter(r => pekanOf(r.date, start, 604800000) === i);
      cum += rows.filter(r => r.category === 'Pemulihan Hafalan Hilang' && r.status === 'Berhasil').reduce((a, r) => a + pageCount(r.pages), 0);
      return { week: 'W' + (i + 1), recovered: pct(cum, total), success: pct(rows.filter(r => r.status === 'Berhasil').length, rows.length) };
    });
  }, [santriList, setoranList]);

  return (
    <div className="min-h-screen bg-[#fdfbf7] text-slate-800 font-sans flex flex-col md:flex-row">
      
      {/* LOGIN OVERLAY IF NOT AUTHENTICATED */}
      {!isAuthenticated && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#064e3b]/95 p-4 backdrop-blur-md">
          {/* Islamic Ornament Pattern Background Overlay */}
          <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#d97706_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>

          <div className="relative w-full max-w-md bg-[#ffffff] rounded-2xl shadow-2xl border border-amber-200/40 p-8 overflow-hidden">
            {/* Top Decorative Border */}
            <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-emerald-800 via-amber-500 to-emerald-800"></div>

            {/* Prominent Header */}
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-100 text-emerald-900 border-2 border-amber-400 mb-3 shadow-inner">
                <BookOpen className="w-8 h-8 text-emerald-800" />
              </div>
              <h1 className="text-4xl font-extrabold tracking-tight text-emerald-950 font-serif">NAHYA</h1>
              <p className="text-sm font-semibold tracking-widest text-amber-700 uppercase mt-0.5">KOORDINATOR TAHFIZ</p>
              <div className="w-16 h-0.5 bg-amber-400 mx-auto my-2"></div>
              <p className="text-xs text-slate-600 italic">"Membangun Generasi Penghafal Al-Qur'an yang Mutqin."</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              {authError && <div className="p-2 bg-rose-50 border border-rose-200 text-rose-800 text-xs rounded">{authError}</div>}
              {!supabaseUrl && <div><label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Project URL Supabase</label><input name="url" required placeholder="https://xxxx.supabase.co" className="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-sm bg-slate-50" /></div>}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Koordinator / Musyrif</label>
                <input 
                  type="email" 
                  required 
                  name="email"
                  className="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:border-transparent outline-none transition text-sm bg-slate-50"
                  placeholder="email@domain.com"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Kata Sandi</label>
                <input 
                  type="password" name="password" required 
                                    className="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:border-transparent outline-none transition text-sm bg-slate-50"

                />
              </div>

              <div className="flex items-center justify-between text-xs">
                <label className="flex items-center space-x-2 text-slate-600 cursor-pointer">

                </label>
                <button 
                  type="button" 
                  onClick={() => setShowForgotModal(true)} 
                  className="text-amber-700 font-semibold hover:underline"
                >
                  Lupa Password?
                </button>
              </div>

              <button 
                type="submit" disabled={authLoading} 
                className="w-full py-3 px-4 bg-emerald-800 hover:bg-emerald-900 text-amber-300 font-bold rounded-lg shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center space-x-2 border border-amber-400/30"

                <span>Masuk ke System Monitoring</span>
                <ChevronRight className="w-4 h-4" />

            <div className="mt-6 pt-5 border-t border-slate-100 text-center">

            </div>

            <p className="text-[10px] text-center text-slate-400 mt-4">
              © 2026 NAHYA Tahfiz Management System v2.4 • Supabase Ready
            </p>
          </div>
        </div>
      )}

      {/* LUPA PASSWORD MODAL */}
      {showForgotModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
          <div className="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
            <h3 className="font-bold text-lg text-emerald-950">Lupa Password System</h3>
            <p className="text-xs text-slate-600">Masukkan email Anda untuk menerima link reset kata sandi melalui Supabase Auth Mailer.</p>
            <input type="email" placeholder="email@domain.com" className="w-full p-2 border rounded text-sm" />
            <div className="flex justify-end space-x-2 pt-2">
              <button onClick={() => setShowForgotModal(false)} className="px-3 py-1.5 text-xs text-slate-600 border rounded">Batal</button>
              <button onClick={() => { alert('Link reset password telah dikirim ke email!'); setShowForgotModal(false); }} className="px-3 py-1.5 text-xs bg-emerald-800 text-white rounded font-medium">Kirim Link</button>

          </div>
        </div>

      <aside className="w-full md:w-64 bg-[#064e3b] text-slate-100 flex-shrink-0 flex flex-col justify-between border-r border-emerald-900/50 shadow-xl">
        <div>
          {/* Sidebar Top Identity - STRICT BRANDING */}
          <div className="p-5 border-b border-emerald-800/60 bg-[#043e2f] relative overflow-hidden">
            <div className="absolute -right-4 -bottom-4 opacity-10 text-amber-300 pointer-events-none">
              <Sparkles className="w-24 h-24" />
            </div>
            
            <div className="flex items-center space-x-3 mb-1">
              <div className="p-2 bg-emerald-900 rounded-lg border border-amber-400/40 text-amber-400 shadow">
                <BookOpen className="w-6 h-6" />
              </div>
              <div>
                <h2 className="text-2xl font-black tracking-wider text-amber-300 font-serif leading-none">NAHYA</h2>
                <p className="text-[10px] font-bold text-emerald-200 tracking-widest uppercase mt-1">KOORDINATOR TAHFIZ</p>
              </div>
            </div>
            <p className="text-[11px] text-emerald-300/80 italic mt-2 leading-tight border-t border-emerald-800/40 pt-2">

              { id: 'santri', label: 'Data Santri', icon: Users },
              { id: 'musyrif', label: 'Data Musyrif', icon: UserCheck },
              { id: 'pemetaan', label: 'Pemetaan Hafalan', icon: Layers },
              { id: 'setoran', label: 'Setoran Harian', icon: CheckSquare },
              { id: 'kontrol12', label: 'Monitoring 12 Pekan', icon: Calendar },
              { id: 'bulanan', label: 'Evaluasi Bulanan', icon: Clock },
              { id: 'evaluasiAkhir', label: 'Evaluasi Akhir 90 Hari', icon: Award },
              { id: 'laporan', label: 'Laporan & Cetak PDF', icon: FileText },
              { id: 'settings', label: 'Pengaturan & Supabase', icon: Settings },
            ].map(item => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg transition-all ${
                    isActive 
                      ? 'bg-amber-500 text-slate-950 font-bold shadow-md transform translate-x-1' 
                      : 'text-emerald-100 hover:bg-emerald-800/70 hover:text-amber-200'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon className={`w-4 h-4 ${isActive ? 'text-slate-950' : 'text-amber-400'}`} />
                    <span>{item.label}</span>
                  </div>
                  {isActive && <ChevronRight className="w-4 h-4 text-slate-950" />}
                </button>
              );
            })}
          </nav>
        </div>

        {/* User Footer Profile & Logout */}
        <div className="p-4 border-t border-emerald-800/60 bg-[#043e2f]">

                N
              </div>
              <div className="truncate">
                <p className="text-xs font-bold text-white truncate">{userRole}</p>
                <button onClick={changePw} className="text-[10px] text-emerald-300 hover:text-amber-300 underline">Ganti Sandi</button>
              </div>
            </div>
            <button 
              onClick={logout}

            </button>
          </div>
        </div>
      </aside>

      {/* MAIN CONTENT AREA */}
      <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
        
        {/* TOP BAR HEADER */}
        <header className="bg-white border-b border-amber-900/10 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-30 shadow-sm">

              </span>

            <div className="bg-emerald-50 text-emerald-900 px-3 py-1.5 rounded-lg border border-emerald-200 text-xs flex items-center space-x-2">

              <span>Input Setoran</span>
            </button>
          </div>

              {/* Salam Greeting Header Card */}

                  <BookOpen className="w-64 h-64 text-amber-300" />
                </div>
                <div className="relative z-10">
                  <div className="inline-block px-3 py-1 bg-amber-500/20 text-amber-300 border border-amber-400/40 rounded-full text-xs font-bold mb-3 uppercase tracking-wider">
                    Program Tahfiz 90 Hari • Koordinator Mode
                  </div>
                  <h3 className="text-2xl sm:text-3xl font-black text-amber-300 font-serif">
                    Assalamu'alaikum, {userRole}.
                  </h3>
                  <p className="text-emerald-100 text-sm max-w-2xl mt-1">
                    Selamat datang di Panel Monitoring Pemulihan & Pemutqinan Hafalan. Pantau progres santri secara riil untuk memastikan target 12 pekan tercapai dengan standar mutqin.
                  </p>
                </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                {[
                  { label: 'Total Santri', val: totalSantri, color: 'bg-emerald-50 border-emerald-200 text-emerald-900', icon: Users },
                  { label: 'Total Musyrif', val: totalMusyrif, color: 'bg-blue-50 border-blue-200 text-blue-900', icon: UserCheck },
                  { label: 'Santri Aktif', val: santriAktif, color: 'bg-teal-50 border-teal-200 text-teal-900', icon: Activity },
                  { label: 'Target Selesai', val: targetCompleted, color: 'bg-amber-50 border-amber-200 text-amber-900', icon: CheckCircle2 },
                  { label: 'Hal. Dipulihkan', val: `${totalPagesRecovered} hal`, color: 'bg-indigo-50 border-indigo-200 text-indigo-900', icon: BookOpen },
                  { label: 'Perlu Penguatan', val: santriPenguatan, color: 'bg-rose-50 border-rose-200 text-rose-900', icon: AlertTriangle },
                  { label: 'Santri Mutqin', val: santriMutqin, color: 'bg-emerald-100 border-emerald-300 text-emerald-950 font-black', icon: Award },
                ].map((stat, i) => {
                  const IconComp = stat.icon;
                  return (
                    <div key={i} className={`p-4 rounded-xl border shadow-sm flex flex-col justify-between ${stat.color}`}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-[11px] font-bold uppercase tracking-wider opacity-80">{stat.label}</span>
                        <IconComp className="w-4 h-4 opacity-70" />
                      </div>
                      <div className="text-2xl font-black tracking-tight">{stat.val}</div>
                    </div>
                  );
                })}
              </div>

              {/* PROGRESS & GRAPH ANALYTICS SECTION */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* 12 Pekan Progression Visualizer */}
                <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                  <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <div>
                      <h4 className="font-bold text-slate-800 text-base">Grafik Perkembangan Hafalan 12 Pekan</h4>
                      <p className="text-xs text-slate-500">Estimasi Rata-rata Pemulihan (Halaman) & Status Mutqin Santri</p>
                    </div>
                    <span className="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-200">
                      Target: 60-100 Hal / Santri
                    </span>
                  </div>

                  {/* SVG Bar Chart Representation */}
                  <div className="h-56 flex items-end justify-between gap-2 pt-6 px-2">
                    {weeklyChart.map((w, idx) => (
                      <div key={idx} className="flex-1 flex flex-col items-center gap-1 group relative">
                        {/* Tooltip */}
                        <div className="absolute -top-8 bg-slate-900 text-white text-[10px] py-0.5 px-1.5 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-20 pointer-events-none">
                          Pekan {idx+1}: pemulihan {w.recovered}% • setoran berhasil {w.success}%
                        </div>
                        <div className="w-full bg-slate-100 rounded-t h-40 flex items-end gap-0.5 overflow-hidden">
                          <div 
                            style={{ height: `${w.recovered}%` }} 
                            className="w-full bg-gradient-to-t from-emerald-800 to-emerald-500 rounded-t transition-all duration-500 group-hover:from-amber-600 group-hover:to-amber-400"
                          ></div>
                          <div style={{ height: `${w.success}%` }} className="w-full bg-amber-500 rounded-t"></div>
                        </div>
                        <span className="text-[10px] font-semibold text-slate-500">{w.week}</span>
                      </div>
                    ))}
                  </div>

                  <div className="flex items-center justify-center space-x-6 mt-4 pt-3 border-t border-slate-100 text-xs text-slate-600">
                    <div className="flex items-center space-x-2">
                      <div className="w-3 h-3 bg-emerald-700 rounded"></div>
                      <span>Progres Pemulihan Hafalan</span>
                    </div>
                    <div className="flex items-center space-x-2">
                      <div className="w-3 h-3 bg-amber-500 rounded"></div>
                      <span>Setoran Berhasil / Pekan</span>
                    </div>
                  </div>
                </div>

                {/* Status Hafalan Breakdown Pie/Gauge */}

                  <div>
                    <h4 className="font-bold text-slate-800 text-base mb-1">Status Kualitas Hafalan</h4>
                    <p className="text-xs text-slate-500 mb-4">Proporsi Mutqin vs Perlu Penguatan</p>

                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-emerald-800">Sudah Mutqin</span>
                          <span>{santriMutqin} Santri ({pct(santriMutqin,totalSantri)}%)</span>
                        </div>
                        <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full bg-emerald-700 rounded-full" style={{ width: `${pct(santriMutqin,totalSantri)}%` }}></div>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-amber-800">Perlu Penguatan / Murajaah Ulang</span>
                          <span>{santriPenguatan} Santri ({pct(santriPenguatan,totalSantri)}%)</span>
                        </div>
                        <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full bg-amber-500 rounded-full" style={{ width: `${pct(santriPenguatan,totalSantri)}%` }}></div>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-rose-800">Pendampingan Khusus</span>
                          <span>{santriKhusus} Santri ({pct(santriKhusus,totalSantri)}%)</span>
                        </div>
                        <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full bg-rose-500 rounded-full" style={{ width: `${pct(santriKhusus,totalSantri)}%` }}></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="p-3 bg-amber-50 rounded-lg border border-amber-200 text-xs text-amber-900 mt-4">
                    <p className="font-bold mb-1 flex items-center gap-1">
                      <AlertTriangle className="w-3.5 h-3.5 text-amber-700" />
                      <span>Catatan Penilaian:</span>
                    </p>
                    <p className="text-[11px] leading-relaxed">
                      "Selesai dipelajari kembali tidak otomatis mutqin. Penetapan mutqin harus melalui Ujian Tasmi' Musyrif."
                    </p>
                  </div>
                </div>
              </div>

              {/* RECENT SETORAN FEED TABLE */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                  <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <Clock className="w-4 h-4 text-emerald-800" />
                    <span>Aktivitas Setoran Terbaru</span>
                  </h4>
                  <button onClick={() => setActiveTab('setoran')} className="text-xs font-bold text-emerald-800 hover:underline">
                    Lihat Semua Setoran →
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-slate-50 text-slate-900 font-bold uppercase border-b border-slate-200">
                      <tr>
                        <th className="p-3">Tanggal</th>
                        <th className="p-3">Nama Santri</th>
                        <th className="p-3">Kategori</th>
                        <th className="p-3">Materi (Juz/Surah/Hal)</th>
                        <th className="p-3">Status</th>
                        <th className="p-3">Catatan Kesalahan</th>
                        <th className="p-3">Musyrif</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">

                          <td className="p-3 font-bold text-emerald-950">{row.santriName}</td>
                          <td className="p-3">
                            <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-800 text-[10px] font-semibold">
                              {row.category}

                          </td>
                          <td className="p-3">Juz {row.juz} • {row.surah} ({row.pages})</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${statusCls(row.status)}`}>
                              {row.status}
                            </span>
                          </td>
                          <td className="p-3 text-slate-500 max-w-xs truncate">{row.errors || '-'}</td>
                          <td className="p-3 text-slate-600 font-medium">{row.musyrifName}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>

              {/* Header Action Bar */}

                <div className="relative w-full sm:w-72">
                  <Search className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                  <input 
                    type="text" 
                    placeholder="Cari Nama / NIS Santri..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-emerald-700"
                  />
                </div>

                <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                  <button 
                    onClick={() => { setEditingSantri(null); setShowSantriModal(true); }}
                    className="px-4 py-2 bg-emerald-800 hover:bg-emerald-900 text-amber-300 font-bold rounded-lg text-xs flex items-center space-x-1.5 shadow"
                  >
                    <Plus className="w-4 h-4" />
                    <span>Tambah Santri Baru</span>
                  </button>
                </div>
              </div>

              {/* Santri Data Table */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">

                        <th className="p-3">Kelompok</th>
                        <th className="p-3">Musyrif Pembimbing</th>
                        <th className="p-3 text-center">Total Hafalan</th>
                        <th className="p-3 text-center">Hafalan Hilang</th>
                        <th className="p-3 text-center">Progres Pemulihan</th>

                          const percent = Math.round((s.recoveredPages / s.targetPemulihanHal) * 100) || 0;

                            <tr key={s.id} className="hover:bg-slate-50 transition">
                              <td className="p-3 font-mono font-medium text-slate-500">{s.nis}</td>
                              <td className="p-3 font-bold text-slate-900">{s.name}</td>
                              <td className="p-3 text-slate-600">{s.group}</td>
                              <td className="p-3 text-emerald-900 font-medium">{s.musyrifName}</td>
                              <td className="p-3 text-center font-semibold">{s.totalHafalanJuz} Juz</td>
                              <td className="p-3 text-center text-rose-700 font-semibold">{s.hafalanHilangJuz} Juz ({s.targetPemulihanHal} Hal)</td>
                              <td className="p-3 text-center">
                                <div className="w-full bg-slate-100 rounded-full h-3 max-w-[100px] mx-auto overflow-hidden">
                                  <div className="bg-emerald-700 h-full rounded-full" style={{ width: `${percent}%` }}></div>
                                </div>
                                <span className="text-[10px] text-slate-500 font-medium">{s.recoveredPages} / {s.targetPemulihanHal} hal ({percent}%)</span>

                              <td className="p-3">
                                <select value={s.statusMutqin} onChange={e => { const v = e.target.value; setSantriList(l => l.map(x => x.id === s.id ? { ...x, statusMutqin: v } : x)); sync(c => c.from('santri').update({ status_mutqin: v }).eq('id', s.id)); }} className="p-1 border rounded text-[10px] font-bold bg-white">

                                </select>
                              </td>

                                <div className="flex items-center justify-center space-x-1">

              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Target Kurang Lancar</label>
                <input type="text" name="targetKurangLancar" defaultValue={editingSantri?.targetKurangLancar || '2 Juz'} required className="w-full p-2 border rounded" />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Target Murajaah Mutqin</label>
                <input type="text" name="targetMutqin" defaultValue={editingSantri?.targetMutqin || '5 Juz'} required className="w-full p-2 border rounded" />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Tanggal Mulai Program</label>
                <input type="date" name="startDate" defaultValue={editingSantri?.startDate || '2026-01-10'} required className="w-full p-2 border rounded" />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t">
                <button type="button" onClick={() => setShowSantriModal(false)} className="px-4 py-2 border rounded font-semibold text-slate-600">Batal</button>
                <button type="submit" className="px-4 py-2 bg-emerald-800 text-amber-300 font-bold rounded hover:bg-emerald-900">Simpan Data Santri</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL INPUT SETORAN HARIAN */}
      {showSetoranModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-bold text-emerald-950 text-base">Pencatatan Setoran Harian</h3>
              <button onClick={() => setShowSetoranModal(false)}><X className="w-5 h-5 text-slate-400" /></button>
            </div>

            <form onSubmit={handleSaveSetoran} className="space-y-3 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Pilih Santri</label>
                <select name="santriId" className="w-full p-2 border rounded font-semibold">
                  {santriList.map(s => (
                    <option key={s.id} value={s.id}>{s.name} ({s.group})</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Tanggal Setoran</label>
                <input type="date" name="date" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full p-2 border rounded" />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Kategori Setoran</label>
                <select name="category" className="w-full p-2 border rounded">
                  <option value="Pemulihan Hafalan Hilang">1. Pemulihan Hafalan Hilang</option>
                  <option value="Murajaah Kurang Lancar">2. Murajaah Kurang Lancar</option>
                  <option value="Murajaah Mutqin">3. Murajaah Mutqin</option>
                </select>
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Juz</label>
                  <input type="number" name="juz" defaultValue={1} required className="w-full p-2 border rounded" />
                </div>
                <div className="col-span-2">
                  <label className="block font-bold text-slate-700 mb-1">Surah & Halaman</label>
                  <input type="text" name="surah" defaultValue="Al-Baqarah" placeholder="Surah" required className="w-full p-2 border rounded mb-1" />
                  <input type="text" name="pages" defaultValue="Hal 1-2" placeholder="Halaman" required className="w-full p-2 border rounded" />
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Status Setoran</label>
                <select name="status" className="w-full p-2 border rounded font-bold">
                  <option value="Berhasil">Berhasil (Lulus)</option>
                  <option value="Belum Lulus">Belum Lulus</option>
                  <option value="Perlu Pengulangan">Perlu Pengulangan</option>
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Catatan Kesalahan</label>
                <input type="text" name="errors" placeholder="Contoh: Macet di mad jaiz" className="w-full p-2 border rounded" />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Bagian Diulang</label>
                <input type="text" name="repeatPart" placeholder="Contoh: Ayat 15-20" className="w-full p-2 border rounded" />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t">
                <button type="button" onClick={() => setShowSetoranModal(false)} className="px-4 py-2 border rounded font-semibold text-slate-600">Batal</button>
                <button type="submit" className="px-4 py-2 bg-amber-600 text-white font-bold rounded hover:bg-amber-700">Simpan Setoran</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* MODAL TAMBAH MUSYRIF */}
      {showMusyrifModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-bold text-emerald-950 text-base">Tambah Musyrif Pembimbing</h3>
              <button onClick={() => setShowMusyrifModal(false)}><X className="w-5 h-5 text-slate-400" /></button>
            </div>

            <form onSubmit={async (e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              const newMusyrif = {
                id: crypto.randomUUID(),
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                assignedCount: 0,
              };
              if (!demo && sb) {
                const { data: fr, error: fe } = await sb.functions.invoke('create-musyrif', { body: { action: 'create', name: newMusyrif.name, email: newMusyrif.email } });
                let msg = fr?.error;
                if (fe) { msg = fe.message; try { msg = (await fe.context.json()).error || msg; } catch (x) {} }
                if (msg) { alert('Gagal membuat akun login: ' + msg); return; }
              }
              setMusyrifList([...musyrifList, newMusyrif]);
              sync(c => c.from('musyrif').insert({ id: newMusyrif.id, name: newMusyrif.name, email: newMusyrif.email, phone: newMusyrif.phone }));
              setShowMusyrifModal(false);
            }} className="space-y-3 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Nama Musyrif</label>
                <input type="text" name="name" required placeholder="Ust. Name" className="w-full p-2 border rounded" />
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required placeholder="musyrif@nahyatahfiz.id" className="w-full p-2 border rounded" />
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">Nomor WhatsApp / HP</label>
                <input type="text" name="phone" required placeholder="0812..." className="w-full p-2 border rounded" />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t">
                <button type="button" onClick={() => setShowMusyrifModal(false)} className="px-4 py-2 border rounded font-semibold text-slate-600">Batal</button>
                <button type="submit" className="px-4 py-2 bg-emerald-800 text-amber-300 font-bold rounded hover:bg-emerald-900">Simpan Musyrif</button>
              </div>
            </form>
          </div>
        </div>
      )}

    </div>
  );
}

// Icon Layout Helper
function LayoutDashboardIcon(props) {
  return <BarChart3 {...props} />;
}

// SQL Schema Constant for Copy-Pasting to Supabase
const SUPABASE_SQL_SCHEMA = `-- SQL MIGRATION FOR NAHYA TAHFIZ MANAGEMENT (90 HARI PROGRAM)
-- Execute this script in your Supabase SQL Editor to create initial schema with RLS

-- 1. Profiles Table
CREATE TABLE IF NOT EXISTS public.profiles (
  id UUID REFERENCES auth.users ON DELETE CASCADE PRIMARY KEY,
  name TEXT NOT NULL,
  role TEXT DEFAULT 'Musyrif' CHECK (role IN ('Koordinator', 'Musyrif', 'Admin')),
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL
);

-- 2. Musyrif Table
CREATE TABLE IF NOT EXISTS public.musyrif (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  name TEXT NOT NULL,
  email TEXT UNIQUE NOT NULL,
  phone TEXT,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now())
);

-- 3. Santri Table
CREATE TABLE IF NOT EXISTS public.santri (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  nis TEXT UNIQUE NOT NULL,
  name TEXT NOT NULL,
  group_name TEXT NOT NULL,
  musyrif_id UUID REFERENCES public.musyrif(id),
  total_hafalan_juz INT DEFAULT 0,
  hafalan_hilang_juz INT DEFAULT 0,
  target_pemulihan_hal INT DEFAULT 0,
  target_kurang_lancar TEXT,
  target_mutqin TEXT,
  start_date DATE NOT NULL,
  status TEXT DEFAULT 'Aktif',
  recovered_pages INT DEFAULT 0,
  status_mutqin TEXT DEFAULT 'Perlu Penguatan',
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now())
);

-- 4. Pemetaan Hafalan Table
CREATE TABLE IF NOT EXISTS public.pemetaan_hafalan (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  santri_id UUID REFERENCES public.santri(id) ON DELETE CASCADE,
  category TEXT NOT NULL CHECK (category IN ('Hilang', 'Kurang Lancar', 'Mutqin')),
  juz_surah_pages TEXT NOT NULL,
  status_awal TEXT NOT NULL,
  catatan_musyrif TEXT,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now())
);

-- 5. Setoran Harian Table
CREATE TABLE IF NOT EXISTS public.setoran_harian (
  id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  santri_id UUID REFERENCES public.santri(id) ON DELETE CASCADE,
  date DATE NOT NULL,
  category TEXT NOT NULL,
  juz INT NOT NULL,
  surah TEXT NOT NULL,
  pages TEXT NOT NULL,
  status TEXT NOT NULL CHECK (status IN ('Berhasil', 'Belum Lulus', 'Perlu Pengulangan')),
  errors TEXT,
  repeat_part TEXT,
  musyrif_id UUID REFERENCES public.musyrif(id),
  confirmed BOOLEAN DEFAULT true,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now())
);

-- Enable Row Level Security (RLS)
ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.santri ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.setoran_harian ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.musyrif ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.pemetaan_hafalan ENABLE ROW LEVEL SECURITY;

-- Akses hanya untuk pengguna login yang punya profil staf
CREATE OR REPLACE FUNCTION public.is_staff() RETURNS BOOLEAN LANGUAGE sql SECURITY DEFINER SET search_path = public AS $$
  SELECT EXISTS (SELECT 1 FROM public.profiles WHERE id = auth.uid() AND role IN ('Koordinator','Musyrif','Admin'));
$$;
CREATE POLICY "own profile" ON public.profiles FOR SELECT TO authenticated USING (id = auth.uid());
CREATE POLICY "staff musyrif" ON public.musyrif FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());
CREATE POLICY "staff santri" ON public.santri FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());
CREATE POLICY "staff pemetaan" ON public.pemetaan_hafalan FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());
CREATE POLICY "staff setoran" ON public.setoran_harian FOR ALL TO authenticated USING (public.is_staff()) WITH CHECK (public.is_staff());
`;
